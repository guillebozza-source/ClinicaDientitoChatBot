<!DOCTYPE html>

<head>

      max-width: 600px;

      padding: 12px 24px; 
      background: #0070f3; 
      color: white; 
      text-decoration: none; 
      border-radius: 6px; 
      margin-top: 20px; 
      font-weight: bold; 
      transition: background 0.2s;

    .btn-help:hover { background: #0051a8; }
